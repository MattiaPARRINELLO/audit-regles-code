name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer pytest
        run: python -m pip install --upgrade pip pytest
      - name: Lancer les tests
        run: python -m pytest -q tests
